name: CI

on:
  pull_request:
    branches:
      - master
      - release/beta
      - develop
  push:
    branches:
      - master
      - release/beta
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine Turbo filter
        id: filter
        # En PRs: solo afectados por el base ref (corre rápido). En push a
        # long-lived branches: pipeline completo (filter vacío → no flag).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--filter=...[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: pnpm exec turbo run lint ${{ steps.filter.outputs.args }}

      - name: Typecheck
        run: pnpm exec turbo run typecheck ${{ steps.filter.outputs.args }}

      - name: Test
        run: pnpm exec turbo run test ${{ steps.filter.outputs.args }}

      - name: Build
        run: pnpm exec turbo run build ${{ steps.filter.outputs.args }}

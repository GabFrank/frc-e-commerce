# Nginx server block para frc-e-commerce
# Path: /etc/nginx/conf.d/frc-ecommerce.conf
#
# Antes de habilitar HTTPS, certbot --nginx -d app.frc-ecommerce.com va a
# agregar automáticamente las directivas ssl_certificate y un redirect 80→443.
# Este archivo arranca con HTTP only para que certbot pueda hacer el challenge.

server {
    listen 80;
    listen [::]:80;
    server_name app.frc-ecommerce.com;

    # ACME challenge para Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy reverso a Next.js en localhost:3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserva el Host original para que proxy.ts resuelva el tenant
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte WebSocket (Next 16 HMR + Server Actions streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts razonables para Server Actions / SSR pesado
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Tamaño máximo de upload (imágenes de producto, etc.)
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/frc-ecommerce-access.log;
    error_log /var/log/nginx/frc-ecommerce-error.log;
}

# Solo para dev local cuando querés Postgres en vez de SQLite.
# Uso: docker compose up -d postgres
# Después: DATABASE_URL=postgres://vendure:vendure@localhost:6543/frc_ecommerce_dev pnpm dev:server

services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '6543:5432'
    environment:
      POSTGRES_DB: frc_ecommerce_dev
      POSTGRES_USER: vendure
      POSTGRES_PASSWORD: vendure
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendure']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
